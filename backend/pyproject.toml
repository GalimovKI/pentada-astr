[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentada-mail-search"
version = "0.1.0"
description = "Local mail-search evaluation and a reproducible BM25 baseline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "snowballstemmer==3.1.1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
minilm = ["numpy>=1.26,<3", "onnxruntime>=1.23,<2", "tokenizers>=0.21,<1"]

# CUDA 12 wheels for the Linux x86_64 dev server. Both runtimes export onnxruntime.
e5-gpu = [
    "numpy>=1.26,<3", "tokenizers>=0.21,<1",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [[{extra = "minilm"}, {extra = "e5-gpu"}]]

[project.scripts]
mailsearch = "mail_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mail_search*"]
