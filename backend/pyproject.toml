[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentada-mail-search"
version = "0.1.0"
description = "Local mail-search evaluation and a reproducible BM25 baseline"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]

[project.scripts]
mailsearch = "mail_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mail_search*"]
