[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentada-mail-search"
version = "0.1.0"
description = "Local mail-search evaluation and a reproducible BM25 baseline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "snowballstemmer==3.1.1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
minilm = ["numpy>=1.26,<3", "onnxruntime==1.32.0", "tokenizers>=0.21,<1"]

minilm-gpu = ["numpy>=1.26,<3", "onnxruntime-gpu[cuda,cudnn]==1.32.0; sys_platform == 'linux' and platform_machine == 'x86_64'", "tokenizers>=0.21,<1"]

[tool.uv]
# Match the academic host's CUDA 13.0 driver without silently upgrading the toolkit.
constraint-dependencies = [
    "nvidia-cuda-runtime<13.1", "nvidia-cuda-nvrtc<13.1", "nvidia-cublas<13.1",
    "nvidia-nvjitlink<13.1", "nvidia-cufft<12.1", "nvidia-curand<10.4.1", "nvidia-cudnn-cu13<9.14",
]
conflicts = [[{extra = "minilm"}, {extra = "minilm-gpu"}]]

[project.scripts]
mailsearch = "mail_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mail_search*"]
