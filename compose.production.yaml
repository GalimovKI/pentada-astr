# Independent from compose.yaml (development PostgreSQL). Always pass -f explicitly.
x-backend: &backend
  image: pentada-mailsearch-backend:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set container DATABASE_URL with host db}
    SEARCH_ENGINE_FACTORY: ${SEARCH_ENGINE_FACTORY:-mail_search.core.engine:load_event_aware}
    SEARCH_CONFIG: ${SEARCH_CONFIG:-/app/configs/search/bm25-event-aware.json}
    SEARCH_DATASET: ${SEARCH_DATASET:-/data/corpus.zip}
  volumes:
    - type: bind
      source: ${CORPUS_PATH:?Set host CORPUS_PATH}
      target: /data/corpus.zip
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./artifacts
      target: /app/artifacts
      read_only: true
    - type: bind
      source: ./configs/search
      target: /app/configs/search
      read_only: true
  depends_on:
    db:
      condition: service_healthy
  init: true
  stop_grace_period: 120s

services:
  db:
    image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 60s

  prepare:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "infra/docker/prepare.py"]

  backend:
    <<: *backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      start_period: ${ENGINE_START_PERIOD:-180s}
      interval: 10s
      timeout: 6s
      retries: 6

  web:
    image: pentada-mailsearch-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/web"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
