# Stable shared entrypoint. Environment deployments never recreate this service.
services:
  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    network_mode: host
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
    volumes:
      - ./infra/docker/Gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/web"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  gateway_data:
  gateway_config:
