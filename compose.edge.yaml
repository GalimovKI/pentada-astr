# Public frontend on a Linux VPS; API arrives through an SSH reverse tunnel.
# Independent of compose.production.yaml; no corpus or database credentials here.
services:
  web:
    image: pentada-mailsearch-web:${APP_IMAGE_TAG:-edge}
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/}
    network_mode: host
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      API_UPSTREAM: 127.0.0.1:${TUNNEL_PORT:-18081}
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      WEB_HEALTH_PORT: ${WEB_HEALTH_PORT:-8081}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$${WEB_HEALTH_PORT}/health/web"']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
