name: CI and deployment

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --project backend --locked
      - run: uv run --project backend --locked python -m unittest discover -s backend/tests -t backend -v
      - run: python3 -m unittest discover -s infra/ci/tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        base: ["/main/", "/dev/"]
    env:
      APP_BASE_PATH: ${{ matrix.base }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    needs: [backend, frontend]
    if: >-
      github.repository == 'GalimovKI/pentada-astr' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, pentada-production]
    timeout-minutes: 40
    concurrency:
      group: pentada-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and deploy both hosts
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref_name }}
        run: python3 infra/ci/deploy.py
